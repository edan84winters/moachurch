name: 유튜브 영상 목록 갱신

on:
  schedule:
    - cron: "17 */3 * * *"   # 3시간마다
  workflow_dispatch:          # 필요하면 손으로도 실행

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_videos.py
      - name: 바뀌었으면 저장
        run: |
          if git diff --quiet -- videos.json; then echo "변경 없음"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos.json
          git commit -m "유튜브 영상 목록 자동 갱신"
          git push
